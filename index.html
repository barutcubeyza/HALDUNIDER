<style>
  :root{
    --navy:#1F2A4D;
    --navy-2:#2E3B66;
    --maroon:#8F2A38;
    --maroon-2:#A83545;
    --cream:#FAF8F5;
    --paper:#FFFFFF;
    --line:#E4E1DA;
    --ink:#242426;
    --ink-soft:#6B6862;
    --gold:#C79A3E;
    --status-todo:#8B8680;
    --status-progress:#C79A3E;
    --status-done:#3D7A5C;
    --status-cancelled:#A35A55;
    --radius:10px;
    font-family:"Segoe UI",Arial,sans-serif;
  }
  #app *{box-sizing:border-box;}
  #app{
    background:var(--cream);
    color:var(--ink);
    min-height:100%;
    padding:0 0 60px 0;
  }
  #app h1,#app h2,#app h3{margin:0;font-family:Georgia,"Times New Roman",serif;}
  .topbar{
    display:flex;align-items:center;gap:16px;
    padding:18px 26px;background:var(--navy);
    border-bottom:4px solid var(--maroon);
    position:sticky;top:0;z-index:30;
  }
  .topbar img{width:44px;height:44px;display:block;}
  .topbar .brand{color:#fff;}
  .topbar .brand h1{font-size:19px;letter-spacing:.02em;}
  .topbar .brand span{font-size:11px;color:#C9CEDE;letter-spacing:.08em;text-transform:uppercase;}
  .tabs{display:flex;gap:4px;margin-left:auto;}
  .tab-btn{
    background:transparent;border:none;color:#C9CEDE;padding:9px 16px;
    border-radius:7px;cursor:pointer;font-size:13.5px;font-weight:600;letter-spacing:.01em;
    transition:.15s;
  }
  .tab-btn:hover{background:rgba(255,255,255,.08);color:#fff;}
  .tab-btn.active{background:var(--maroon);color:#fff;}
  .addbtn{
    background:var(--gold);color:#2b2200;border:none;padding:9px 16px;border-radius:7px;
    font-weight:700;font-size:13.5px;cursor:pointer;margin-left:8px;white-space:nowrap;
  }
  .addbtn:hover{filter:brightness(1.06);}
  .wrap{max-width:1280px;margin:0 auto;padding:22px 26px;}
  .panel-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .panel-title h2{font-size:22px;color:var(--navy);}
  .panel-sub{font-size:13px;color:var(--ink-soft);}

  /* ===== Yıllık Takvim ===== */
  .month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}
  .month-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;min-height:150px;}
  .month-head{background:var(--navy);color:#fff;padding:9px 13px;font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;align-items:center;}
  .month-head .cnt{font-size:11px;background:rgba(255,255,255,.18);padding:2px 7px;border-radius:20px;font-weight:600;}
  .month-body{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .month-empty{color:#B7B3AA;font-size:12.5px;padding:10px 4px;font-style:italic;}
  .chip{
    background:var(--cream);border:1px solid var(--line);border-left:4px solid var(--maroon-2);
    border-radius:6px;padding:7px 9px;cursor:pointer;transition:.12s;
  }
  .chip:hover{background:#F1ECE3;border-color:#D8D3C8;}
  .chip .chip-title{font-size:13px;font-weight:600;color:var(--ink);line-height:1.25;}
  .chip .chip-meta{font-size:11px;color:var(--ink-soft);margin-top:3px;display:flex;justify-content:space-between;gap:6px;}
  .phase-tag{font-size:9.5px;padding:1px 6px;border-radius:20px;background:var(--gold);color:#2b2200;font-weight:700;text-transform:uppercase;letter-spacing:.02em;}

  /* ===== Pano (Kanban) ===== */
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start;}
  .cancelled .title,.cancelled .chip-title{text-decoration:line-through;color:var(--ink-soft);}
  .col{background:#F1EEE7;border-radius:var(--radius);padding:10px;min-height:200px;}
  .col-head{display:flex;align-items:center;gap:8px;padding:4px 6px 12px 6px;}
  .dot{width:9px;height:9px;border-radius:50%;}
  .col-head h3{font-size:13.5px;color:var(--navy);text-transform:uppercase;letter-spacing:.04em;}
  .col-head .cnt{margin-left:auto;background:#fff;border-radius:20px;padding:1px 8px;font-size:11.5px;color:var(--ink-soft);font-weight:700;}
  .card{
    background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:9px;
    cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .card:hover{border-color:var(--maroon-2);}
  .card .cat{font-size:10px;color:var(--maroon-2);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .card .title{font-size:14px;font-weight:600;margin-top:2px;}
  .card .range{font-size:11.5px;color:var(--ink-soft);margin-top:5px;}
  .card .owner{display:flex;align-items:center;gap:6px;margin-top:8px;}
  .avatar{width:20px;height:20px;border-radius:50%;background:var(--navy-2);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .card .owner span{font-size:12px;color:var(--ink);}
  .progress-row{margin-top:8px;display:flex;align-items:center;gap:6px;}
  .progress-bar{flex:1;height:5px;background:#EAE6DC;border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--status-done);}
  .progress-txt{font-size:10.5px;color:var(--ink-soft);white-space:nowrap;}
  .col-empty{font-size:12px;color:#ADA99F;font-style:italic;padding:10px 4px;}

  /* ===== Bu Ay ===== */
  .month-select-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .month-select-row select{padding:8px 12px;border-radius:7px;border:1px solid var(--line);font-size:14px;background:#fff;}
  .task-block{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
  .task-block-head{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .task-block-head .title{font-size:15.5px;font-weight:700;color:var(--navy);}
  .task-block-head .meta{font-size:12px;color:var(--ink-soft);margin-left:auto;display:flex;gap:10px;align-items:center;}
  .status-pill{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;color:#fff;}
  .steps{padding:10px 16px 14px 16px;}
  .step-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);}
  .step-row:last-child{border-bottom:none;}
  .step-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--status-done);cursor:pointer;}
  .step-name{flex:1;font-size:13.5px;}
  .step-name.done{text-decoration:line-through;color:#AFAAA1;}
  .step-owner{font-size:12px;color:var(--ink-soft);background:var(--cream);padding:2px 9px;border-radius:20px;}
  .no-steps{font-size:12.5px;color:#ADA99F;font-style:italic;padding:6px 0;}
  .empty-state{background:var(--paper);border:1px dashed var(--line);border-radius:var(--radius);padding:40px;text-align:center;color:var(--ink-soft);}

  /* ===== Ekip ===== */
  .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}
  .team-card{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .team-card .isim{font-weight:700;font-size:14px;}
  .team-card .alan{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .icon-btn{background:none;border:none;cursor:pointer;color:#B7534F;font-size:15px;padding:2px 6px;border-radius:5px;}
  .icon-btn:hover{background:#F5E4E3;}

  /* ===== Modal ===== */
  .overlay{position:fixed;inset:0;background:rgba(30,26,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;z-index:100;overflow-y:auto;}
  .modal{background:#fff;border-radius:12px;max-width:620px;width:100%;padding:24px 26px 22px 26px;margin-bottom:40px;}
  .modal h2{font-size:18px;color:var(--navy);margin-bottom:16px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:.02em;}
  .field input[type=text],.field textarea,.field select{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;font-family:inherit;background:#fff;
  }
  .field textarea{resize:vertical;min-height:50px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .radio-row{display:flex;gap:16px;}
  .radio-row label{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:500;color:var(--ink);text-transform:none;}
  .checklist{display:flex;flex-wrap:wrap;gap:6px;max-height:120px;overflow-y:auto;border:1px solid var(--line);border-radius:7px;padding:8px;}
  .checklist label{display:flex;align-items:center;gap:5px;font-size:12px;background:var(--cream);padding:3px 8px;border-radius:20px;}
  .step-edit-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .step-edit-row input[type=text]{flex:2;}
  .step-edit-row select{flex:1;}
  .step-edit-row button{background:none;border:none;color:#B7534F;font-size:16px;cursor:pointer;padding:4px 6px;}
  .add-step-btn{background:var(--cream);border:1px dashed var(--line);border-radius:7px;padding:7px 10px;font-size:12.5px;cursor:pointer;color:var(--navy);width:100%;margin-top:4px;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px;}
  .btn{padding:9px 18px;border-radius:7px;border:none;font-weight:700;font-size:13.5px;cursor:pointer;}
  .btn-primary{background:var(--maroon);color:#fff;}
  .btn-primary:hover{background:var(--maroon-2);}
  .btn-ghost{background:none;color:var(--ink-soft);}
  .btn-ghost:hover{color:var(--ink);}
  .btn-danger{background:#fff;color:#B7534F;border:1px solid #E9C9C7;}
  .btn-danger:hover{background:#FBEEED;}
  .close-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:18px;cursor:pointer;color:#AFAAA1;}
  .modal{position:relative;}
  .loading-note{text-align:center;color:var(--ink-soft);padding:60px 0;font-size:13.5px;}
  .save-flash{position:fixed;bottom:18px;right:18px;background:var(--navy);color:#fff;padding:9px 16px;border-radius:8px;font-size:12.5px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;}
  .save-flash.show{opacity:1;}
  @media (max-width:800px){
    .board{grid-template-columns:1fr;}
    .row2,.row3{grid-template-columns:1fr;}
    .topbar{flex-wrap:wrap;padding:14px 16px;}
    .tabs{margin-left:0;order:3;width:100%;overflow-x:auto;}
  }
  .setup-banner{max-width:640px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px 30px;}
  .setup-banner h2{color:var(--maroon);font-size:19px;margin-bottom:10px;}
  .setup-banner ol{margin:14px 0 0 20px;padding:0;}
  .setup-banner li{margin-bottom:10px;font-size:13.5px;line-height:1.5;}
  .setup-banner code{background:var(--cream);padding:1px 6px;border-radius:4px;font-size:12px;}
  .conn-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
  .conn-status{font-size:11px;color:#C9CEDE;display:flex;align-items:center;margin-left:14px;}
</style>

  let TASKS = [];

  function setConn(state){
    const el = document.getElementById("connStatus");
    if(!el) return;
    const map = {
      connecting: ["#C79A3E","Bağlanıyor…"],
      live: ["#3D7A5C","Canlı — ekip senkron"],
      error: ["#B7534F","Bağlantı hatası"]
    };
    const [color,label] = map[state] || map.connecting;
    el.innerHTML = `<span class="conn-dot" style="background:${color}"></span>${label}`;
  }

  function showSetupBanner(){
    document.getElementById("main").innerHTML = `
      <div class="setup-banner">
        <h2>Bu pano henüz bağlanmadı</h2>
        <p style="font-size:13.5px;color:var(--ink-soft);">Ekibin aynı panoyu canlı görebilmesi için ücretsiz bir Firebase projesi bağlaman gerekiyor (5 dakika, kod yazmadan).</p>
        <ol>
          <li><a href="https://console.firebase.google.com/" target="_blank">console.firebase.google.com</a> adresine git, Google hesabınla gir, <b>"Add project"</b> ile yeni proje oluştur (adı önemli değil, örn. "haldunider-pano").</li>
          <li>Sol menüden <b>Build → Firestore Database → Create database</b>, konum seç, <b>"Start in test mode"</b> seçeneğini işaretle.</li>
          <li>Proje ayarlarına git (dişli ikonu → Project settings), aşağı in, <b>"Your apps"</b> altında <b>&lt;/&gt; (Web)</b> simgesine tıkla, bir isim ver, kayıt et.</li>
          <li>Sana gösterilen <code>firebaseConfig</code> nesnesini kopyala.</li>
          <li>Bu HTML dosyasını bir metin editörüyle aç, en üstteki <code>firebaseConfig</code> bloğunu kopyaladığınla değiştir, kaydet.</li>
          <li>Dosyayı ekibe dağıt (bkz. barındırma seçenekleri) — herkes aynı config'e sahip dosyayı açtığında aynı panoyu görür.</li>
        </ol>
      </div>`;
    setConn("error");
  }

  async function loadData(){
    if(NOT_CONFIGURED){ showSetupBanner(); return; }
    try{
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      docRef = db.collection("haldunider_boards").doc(BOARD_ID);
    }catch(e){
      showSetupBanner();
      return;
    }
    docRef.onSnapshot((snap)=>{
      if(snap.exists){
        const data = snap.data();
        TASKS = data.tasks ? JSON.parse(data.tasks) : DEFAULT_TASKS;
        TEAM = data.team ? JSON.parse(data.team) : DEFAULT_TEAM;
      }else{
        TASKS = DEFAULT_TASKS;
        TEAM = DEFAULT_TEAM;
        docRef.set({tasks: JSON.stringify(TASKS), team: JSON.stringify(TEAM)});
      }
      setConn("live");
      render();
    }, (err)=>{
      console.error(err);
      setConn("error");
      if(TASKS.length===0){ TASKS = DEFAULT_TASKS; TEAM = DEFAULT_TEAM; render(); }
    });
  }

  let saveTimer=null;
  function persist(){
    flashSave();
    if(!docRef) return;
    docRef.set({tasks: JSON.stringify(TASKS), team: JSON.stringify(TEAM)}).catch(e=>{
      console.error(e);
      setConn("error");
    });
  }
  function flashSave(){
    const el = document.getElementById("saveFlash");
    el.classList.add("show");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>el.classList.remove("show"),1200);
  }

  function esc(s){
    return (s||"").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function initials(name){
    if(!name) return "?";
    return name.split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  }
  function personName(id){
    const p = TEAM.find(x=>x.id===id);
    return p ? p.isim : "";
  }
  function monthIdx(name){ return MONTHS.indexOf(name); }

  function taskMonths(task){
    if(task.tip==="Çok Adımlı" && task.bas!=null && task.bit!=null){
      const out=[];
      for(let i=task.bas;i<=task.bit;i++) out.push(i);
      return out;
    }else if(task.bas!=null){
      return [task.bas];
    }
    return [];
  }
  function phaseLabel(task, m){
    if(task.tip!=="Çok Adımlı") return "";
    if(m===task.bas) return "başlangıç";
    if(m===task.bit) return "bitiş";
    return "devam";
  }
  function stepProgress(task){
    const steps = task.adimlar||[];
    if(steps.length===0) return null;
    const done = steps.filter(s=>s.durum==="Tamamlandı").length;
    return {done, total:steps.length};
  }

  // ===================== RENDER SHELL =====================
  function render(){
    renderTabs();
    const main = document.getElementById("main");
    if(currentTab==="takvim") main.innerHTML = renderTakvim();
    else if(currentTab==="pano") main.innerHTML = renderPano();
    else if(currentTab==="buay") main.innerHTML = renderBuAy();
    else if(currentTab==="ekip") main.innerHTML = renderEkip();
    attachMainEvents();
  }

  function renderTabs(){
    const tabs = [["takvim","Yıllık Takvim"],["pano","Pano"],["buay","Bu Ay"],["ekip","Ekip"]];
    document.getElementById("tabs").innerHTML = tabs.map(([k,l])=>
      `<button class="tab-btn ${currentTab===k?'active':''}" data-tab="${k}">${l}</button>`
    ).join("");
  }

  // ===================== YILLIK TAKVIM =====================
  function renderTakvim(){
    let cards = MONTHS.map((mname, mi)=>{
      const items = TASKS.filter(t=>taskMonths(t).includes(mi));
      const body = items.length ? items.map(t=>{
        const ph = phaseLabel(t, mi);
        return `<div class="chip${t.durum==="İptal Edildi"?" cancelled":""}" data-open="${t.id}" style="border-left-color:${catColor(t.kategori)}">
          <div class="chip-title">${esc(t.madde)} ${ph?`<span class="phase-tag">${ph}</span>`:""}</div>
          <div class="chip-meta"><span>${esc(personName(t.ana)||"Sorumlu atanmadı")}</span><span style="color:${catColor(t.kategori)};font-weight:600;">${esc(t.kategori)}</span></div>
        </div>`;
      }).join("") : `<div class="month-empty">Bu ay için iş yok</div>`;
      return `<div class="month-card">
        <div class="month-head"><span>${mname}</span><span class="cnt">${items.length}</span></div>
        <div class="month-body">${body}</div>
      </div>`;
    }).join("");
    return `<div class="panel-title"><div><h2>Yıllık Takvim</h2><div class="panel-sub">Her ayın altında o aya denk gelen işler ve ana sorumluları. Çok adımlı işler ilgili tüm aylarda görünür.</div></div></div>
    ${renderCatLegend()}
    <div class="month-grid">${cards}</div>`;
  }

  // ===================== PANO (KANBAN) =====================
  function renderPano(){
    const cols = STATUS.map(st=>{
      const items = TASKS.filter(t=>t.durum===st);
      const cardsHtml = items.length ? items.map(t=>{
        const prog = stepProgress(t);
        const range = t.bas!=null ? (t.tip==="Çok Adımlı" ? `${MONTHS[t.bas]} – ${MONTHS[t.bit]}` : MONTHS[t.bas]) : "Ay atanmadı";
        return `<div class="card${t.durum==="İptal Edildi"?" cancelled":""}" data-open="${t.id}" style="border-top:3px solid ${catColor(t.kategori)}">
          <div class="cat">${esc(t.kategori)}</div>
          <div class="title">${esc(t.madde)}</div>
          <div class="range">📅 ${range}</div>
          <div class="owner"><div class="avatar">${initials(personName(t.ana))}</div><span>${esc(personName(t.ana)||"Sorumlu yok")}</span></div>
          ${prog ? `<div class="progress-row"><div class="progress-bar"><div class="progress-fill" style="width:${Math.round(100*prog.done/prog.total)}%"></div></div><div class="progress-txt">${prog.done}/${prog.total} adım</div></div>` : ""}
        </div>`;
      }).join("") : `<div class="col-empty">Bu durumda iş yok</div>`;
      return `<div class="col">
        <div class="col-head"><span class="dot" style="background:${STATUS_COLOR[st]}"></span><h3>${st}</h3><span class="cnt">${items.length}</span></div>
        ${cardsHtml}
      </div>`;
    }).join("");
    return `<div class="panel-title"><div><h2>Pano</h2><div class="panel-sub">Tüm işler durumlarına göre. Bir karta tıklayıp durumunu değiştirebilirsin.</div></div></div>
    ${renderCatLegend()}
    <div class="board">${cols}</div>`;
  }

  // ===================== BU AY =====================
  function renderBuAy(){
    const mi = monthIdx(buAySecim);
    const items = TASKS.filter(t=>taskMonths(t).includes(mi));
    const opts = MONTHS.map(m=>`<option value="${m}" ${m===buAySecim?"selected":""}>${m}</option>`).join("");
    let body;
    if(items.length===0){
      body = `<div class="empty-state">${buAySecim} ayında planlanmış iş yok. Sağ üstten "+ Yeni İş" ile ekleyebilirsin.</div>`;
    }else{
      body = items.map(t=>{
        const ph = phaseLabel(t, mi);
        const steps = t.adimlar||[];
        const stepsHtml = steps.length ? steps.map(s=>`
          <div class="step-row">
            <input type="checkbox" data-step-toggle="${t.id}|${s.id}" ${s.durum==="Tamamlandı"?"checked":""}/>
            <div class="step-name ${s.durum==='Tamamlandı'?'done':''}">${esc(s.ad)}</div>
            <div class="step-owner">${esc(personName(s.sorumlu)||"—")}</div>
          </div>`).join("") : `<div class="no-steps">Bu iş için henüz adım tanımlanmadı. Düzenle'ye tıklayıp adım ekleyebilirsin.</div>`;
        return `<div class="task-block" style="border-left:4px solid ${catColor(t.kategori)}">
          <div class="task-block-head">
            <div class="title">${esc(t.madde)} ${ph?`<span class="phase-tag">${ph}</span>`:""}</div>
            <span style="font-size:11px;color:${catColor(t.kategori)};font-weight:700;">${esc(t.kategori)}</span>
            <div class="meta">
              <span>Ana sorumlu: <strong>${esc(personName(t.ana)||"—")}</strong></span>
              <span class="status-pill" style="background:${STATUS_COLOR[t.durum]}">${t.durum}</span>
              <button class="icon-btn" data-open="${t.id}" title="Düzenle">✎</button>
            </div>
          </div>
          <div class="steps">${stepsHtml}</div>
        </div>`;
      }).join("");
    }
    return `<div class="panel-title"><div><h2>Bu Ay</h2><div class="panel-sub">Seçtiğin ayda aktif olan işler ve adım adım kimin ne yaptığı.</div></div></div>
    <div class="month-select-row"><label style="font-size:13px;color:var(--ink-soft);font-weight:600;">Ay:</label><select id="buAySelect">${opts}</select></div>

      <div class="team-card">
        <div><div class="isim">${esc(p.isim)}</div><div class="alan">${esc(p.alan)}</div></div>

  // ===================== MODAL: TASK =====================
  function personOptions(selectedId){
    return `<option value="">— seçiniz —</option>` + TEAM.map(p=>`<option value="${p.id}" ${p.id===selectedId?"selected":""}>${esc(p.isim)}</option>`).join("");
  }
  function monthOptions(selectedIdx){
    return `<option value="">—</option>` + MONTHS.map((m,i)=>`<option value="${i}" ${i===selectedIdx?"selected":""}>${m}</option>`).join("");
  }

  function openTaskModal(taskId){
    editingTaskId = taskId;
    const t = taskId ? TASKS.find(x=>x.id===taskId) : {
      id:"t"+Date.now(), kategori:"Yıllık Plan", madde:"", tip:"Tek Seferlik",
      bas:null, bit:null, ana:"", ilgili:[], durum:"Yapılacak", not:"", adimlar:[]
    };
    window.__editDraft = JSON.parse(JSON.stringify(t));
    renderTaskModal();
  }

  function renderTaskModal(){
    const t = window.__editDraft;
    const catOpts = CATS.map(c=>`<option value="${c}" ${c===t.kategori?"selected":""}>${c}</option>`).join("");
    const ilgiliChecks = TEAM.map(p=>`
      <label><input type="checkbox" data-ilgili="${p.id}" ${t.ilgili.includes(p.id)?"checked":""}/> ${esc(p.isim)}</label>
    `).join("");
    const stepsRows = (t.adimlar||[]).map((s,idx)=>`
      <div class="step-edit-row" data-step-row="${idx}">
        <input type="text" data-step-field="ad" data-step-idx="${idx}" value="${esc(s.ad)}" placeholder="Adım adı"/>
        <select data-step-field="sorumlu" data-step-idx="${idx}">${personOptions(s.sorumlu)}</select>
        <select data-step-field="durum" data-step-idx="${idx}">${STATUS.map(st=>`<option value="${st}" ${st===s.durum?"selected":""}>${st}</option>`).join("")}</select>
        <button data-step-del="${idx}" title="Adımı sil">✕</button>
      </div>`).join("");

    const isMulti = t.tip==="Çok Adımlı";
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "taskOverlay";
    overlay.innerHTML = `
      <div class="modal">
        <button class="close-x" id="closeModal">✕</button>
        <h2>${editingTaskId?"İşi Düzenle":"Yeni İş"}</h2>
        <div class="field"><label>Madde</label><input type="text" id="f_madde" value="${esc(t.madde)}" placeholder="Örn. Oryantasyon programı"/></div>
        <div class="row2">
          <div class="field"><label>Kategori</label><select id="f_kategori">${catOpts}</select></div>
          <div class="field"><label>Tip</label>
            <div class="radio-row" style="padding-top:6px;">
              <label><input type="radio" name="f_tip" value="Tek Seferlik" ${!isMulti?"checked":""}/> Tek Seferlik</label>
              <label><input type="radio" name="f_tip" value="Çok Adımlı" ${isMulti?"checked":""}/> Çok Adımlı</label>
            </div>
          </div>
        </div>
        <div class="row2">
          <div class="field"><label>${isMulti?"Başlangıç Ay":"Ay"}</label><select id="f_bas">${monthOptions(t.bas)}</select></div>
          <div class="field" id="bitWrap" style="${isMulti?"":"display:none;"}"><label>Bitiş Ay</label><select id="f_bit">${monthOptions(t.bit)}</select></div>
        </div>
        <div class="row2">
          <div class="field"><label>Ana Sorumlu</label><select id="f_ana">${personOptions(t.ana)}</select></div>
          <div class="field"><label>Durum</label><select id="f_durum">${STATUS.map(st=>`<option value="${st}" ${st===t.durum?"selected":""}>${st}</option>`).join("")}</select></div>
        </div>
        <div class="field"><label>İlgili Kişiler (opsiyonel)</label><div class="checklist">${ilgiliChecks}</div></div>
        <div class="field"><label>Not</label><textarea id="f_not" placeholder="Kısa not…">${esc(t.not)}</textarea></div>
        <div class="field">
          <label>Adımlar / Görev Dağılımı</label>
          <div id="stepsContainer">${stepsRows}</div>
          <button class="add-step-btn" id="addStepBtn">+ Adım Ekle</button>
        </div>
        <div class="modal-actions">
          <div>${editingTaskId?`<button class="btn btn-danger" id="deleteTaskBtn">İşi Sil</button>`:""}</div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-ghost" id="cancelModal">Vazgeç</button>
            <button class="btn btn-primary" id="saveTaskBtn">Kaydet</button>
          </div>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    attachModalEvents();
  }

  function closeModal(){
    const ov = document.getElementById("taskOverlay");
    if(ov) ov.remove();
    editingTaskId = null;
    window.__editDraft = null;
  }

  function attachModalEvents(){
    const ov = document.getElementById("taskOverlay");
    ov.querySelector("#closeModal").onclick = closeModal;
    ov.querySelector("#cancelModal").onclick = closeModal;
    ov.addEventListener("click", e=>{ if(e.target===ov) closeModal(); });

    ov.querySelectorAll('input[name="f_tip"]').forEach(r=>{
      r.onchange = ()=>{
        window.__editDraft.tip = ov.querySelector('input[name="f_tip"]:checked').value;
        syncDraftFromForm();
        ov.remove();
        renderTaskModal();
      };
    });

    const addStepBtn = ov.querySelector("#addStepBtn");
    if(addStepBtn) addStepBtn.onclick = ()=>{
      syncDraftFromForm();
      window.__editDraft.adimlar.push({id:"s"+Date.now(), ad:"", sorumlu:"", durum:"Yapılacak"});
      ov.remove();
      renderTaskModal();
    };
    ov.querySelectorAll("[data-step-del]").forEach(btn=>{
      btn.onclick = ()=>{
        syncDraftFromForm();
        const idx = parseInt(btn.getAttribute("data-step-del"));
        window.__editDraft.adimlar.splice(idx,1);
        ov.remove();
        renderTaskModal();
      };
    });

    const delBtn = ov.querySelector("#deleteTaskBtn");
    if(delBtn) delBtn.onclick = ()=>{
      if(confirm("Bu işi silmek istediğine emin misin?")){
        TASKS = TASKS.filter(x=>x.id!==editingTaskId);
        persist();
        closeModal();
        render();
      }
    };

    ov.querySelector("#saveTaskBtn").onclick = ()=>{
      syncDraftFromForm();
      const d = window.__editDraft;
      if(!d.madde || d.madde.trim()===""){ alert("Madde adı boş olamaz."); return; }
      if(d.tip==="Tek Seferlik"){ d.bit = d.bas; }
      const idx = TASKS.findIndex(x=>x.id===d.id);
      if(idx>=0) TASKS[idx]=d; else TASKS.push(d);
      persist();
      closeModal();
      render();
    };
  }

  function syncDraftFromForm(){
    const ov = document.getElementById("taskOverlay");
    if(!ov) return;
    const d = window.__editDraft;
    d.madde = ov.querySelector("#f_madde").value;
    d.kategori = ov.querySelector("#f_kategori").value;
    const tipEl = ov.querySelector('input[name="f_tip"]:checked');
    if(tipEl) d.tip = tipEl.value;
    const basVal = ov.querySelector("#f_bas").value;
    d.bas = basVal===""?null:parseInt(basVal);
    const bitEl = ov.querySelector("#f_bit");
    if(bitEl){ const bitVal = bitEl.value; d.bit = bitVal===""?null:parseInt(bitVal); }
    if(d.tip==="Tek Seferlik") d.bit = d.bas;
    d.ana = ov.querySelector("#f_ana").value;
    d.durum = ov.querySelector("#f_durum").value;
    d.not = ov.querySelector("#f_not").value;
    d.ilgili = Array.from(ov.querySelectorAll("[data-ilgili]:checked")).map(el=>el.getAttribute("data-ilgili"));
    const stepRows = ov.querySelectorAll("[data-step-row]");
    stepRows.forEach(row=>{
      const idx = parseInt(row.getAttribute("data-step-row"));
      const adEl = row.querySelector('[data-step-field="ad"]');
      const sEl = row.querySelector('[data-step-field="sorumlu"]');
      const dEl = row.querySelector('[data-step-field="durum"]');
      if(d.adimlar[idx]){
        d.adimlar[idx].ad = adEl.value;
        d.adimlar[idx].sorumlu = sEl.value;
        d.adimlar[idx].durum = dEl.value;
      }
    });
  }

  // ===================== MAIN EVENTS =====================
  function attachMainEvents(){
    document.querySelectorAll(".tab-btn").forEach(b=>{
      b.onclick = ()=>{ currentTab = b.getAttribute("data-tab"); render(); };
    });
    document.querySelectorAll("[data-open]").forEach(el=>{
      el.onclick = (e)=>{ e.stopPropagation(); openTaskModal(el.getAttribute("data-open")); };
    });
    const buAySelect = document.getElementById("buAySelect");
    if(buAySelect) buAySelect.onchange = ()=>{ buAySecim = buAySelect.value; render(); };

    document.querySelectorAll("[data-step-toggle]").forEach(cb=>{
      cb.onchange = ()=>{
        const [tid,sid] = cb.getAttribute("data-step-toggle").split("|");
        const task = TASKS.find(x=>x.id===tid);
        const step = task.adimlar.find(s=>s.id===sid);
        step.durum = cb.checked ? "Tamamlandı" : "Yapılacak";
        persist();
        render();
      };
    });

    document.querySelectorAll("[data-del-person]").forEach(btn=>{
      btn.onclick = ()=>{
        const pid = btn.getAttribute("data-del-person");
        if(confirm("Bu kişiyi ekipten silmek istediğine emin misin? Atanmış olduğu işler etkilenmez, sadece isim boş görünür.")){
          TEAM = TEAM.filter(x=>x.id!==pid);
          persist();
          render();
        }
      };
    });
    const addPersonBtn = document.getElementById("addPersonBtn");
    if(addPersonBtn) addPersonBtn.onclick = ()=>{
      const isim = prompt("İsim Soyisim:");
      if(!isim) return;
      const alan = prompt("Görev / Alan:") || "";
      TEAM.push({id:"p"+Date.now(), isim, alan});
      persist();
      render();
    };
  }

  document.getElementById("newTaskBtn").onclick = ()=>{
    if(NOT_CONFIGURED){ alert("Önce panoyu bir Firebase projesine bağlaman gerekiyor. Ekrandaki kurulum adımlarına bak."); return; }
    openTaskModal(null);
  };

  loadData();
})();
</script>
